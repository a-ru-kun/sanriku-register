<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三陸鉄道 在庫管理＋レジ（Firebase版）</title>
<style>
body{font-family:sans-serif;background:#eef5ff;padding:20px;margin:0}.container{max-width:900px;margin:auto}.card,.item{background:#fff;border-radius:12px;padding:15px;margin-bottom:12px}.item{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:10px}.controls{display:flex;align-items:center;gap:6px}.pm{width:34px;height:34px;font-size:18px}.cartrow{display:flex;justify-content:space-between;margin:4px 0}.money button{margin:3px;padding:8px 10px}.totalbox,.changebox{text-align:center;margin:12px 0;font-weight:bold}.totalbox span,.changebox span{display:block;font-size:42px}.totalbox span{color:#06c;border-bottom:4px solid #06c}.changebox span{color:#d60000;border-bottom:4px solid #d60000}.history{max-height:240px;overflow:auto}button{border:0;border-radius:8px;padding:8px 14px;background:#0b72ff;color:#fff}button:hover{opacity:.9}input,select{padding:8px;border-radius:8px;border:1px solid #ccc}.small{font-size:13px;color:#666}
</style>
</head>
<body>
<div class="container">
<div class="card"><h2>🚆 三陸鉄道 物販在庫管理＋レジ</h2><div class="small" id="syncStatus">Firebase接続中...</div></div>
<div class="card"><h3>レジ</h3><select id="productSelect"></select><input id="qty" type="number" value="1" min="1"><button onclick="addCart()">追加</button><div id="cartView"></div><div class="totalbox">合計<span id="total">¥0</span></div><div class="money"><button onclick="addPaid(10)">10円</button><button onclick="addPaid(100)">100円</button><button onclick="addPaid(500)">500円</button><button onclick="addPaid(1000)">1000円</button><button onclick="addPaid(2000)">2000円</button><button onclick="addPaid(5000)">5000円</button><button onclick="addPaid(10000)">10000円</button><button onclick="setTotalToPaid()">全額</button></div><input id="paid" type="number" placeholder="お預かり金額" oninput="calcChange()"><div class="changebox">おつり<span id="change">¥0</span></div><button onclick="checkout()">会計完了</button> <button onclick="undoLastCheckout()">最後の会計取消</button></div>
<div class="card">売上：<span id="sales">¥0</span> ｜販売数：<span id="sold">0個</span></div>
<div class="card"><h3>会計履歴</h3><button onclick="toggleDeleteMode()" style="background:#d60000">履歴削除</button><div id="history" class="history"></div></div>
<div id="items"></div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {getFirestore,doc,getDoc,setDoc,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyApKg0j7iIBPEaWSLy8v0WApw6ivs6oVq0",authDomain:"aoimori.firebaseapp.com",projectId:"aoimori",storageBucket:"aoimori.firebasestorage.app",messagingSenderId:"305338297712",appId:"1:305338297712:web:239737834d625c6335b3b5",measurementId:"G-NEKXZ89X05"};
const app=initializeApp(firebaseConfig),db=getFirestore(app),inventoryRef=doc(db,"sanriku","inventory");
const DEFAULT_PRODUCTS=[["三鉄絶景ファイル",350,80],["三鉄メモ帳",660,40],["三鉄オリジナルボールペン",300,50],["走る！列車型キーホルダー",670,40],["さんてつオリジナルコースター",300,20],["列車目覚まし時計",1700,10],["三陸鉄道列車型ペンケース",1500,30],["鉄印キーホルダー",550,60],["三鉄チキンカレー",540,60],["さんてつプレミアム缶詰",550,60],["海だけの炊き込みご飯の素",1140,10],["さんてつクッキー",700,100]].map(([name,price,stock])=>({name,price,stock,initial:stock}));
let products=structuredClone(DEFAULT_PRODUCTS),cart=[],historyLog=[],lastSale=null,ignoreSnapshot=false,deleteMode=false;
const productSelect=document.getElementById("productSelect"),cartView=document.getElementById("cartView"),historyDiv=document.getElementById("history"),itemsDiv=document.getElementById("items"),syncStatus=document.getElementById("syncStatus");
function fillProducts(){productSelect.innerHTML=products.map((p,i)=>`<option value="${i}">${p.name} ¥${p.price}</option>`).join("");}
async function saveFirestore(){try{await setDoc(inventoryRef,{stocks:products.map(p=>p.stock),history:historyLog,updatedAt:serverTimestamp()},{merge:true});}catch(error){console.error("Firestore save error:",error);syncStatus.textContent="🔴 Firebase保存エラー";syncStatus.style.color="red";}}
function renderHistory(){historyDiv.innerHTML="";historyLog.forEach(h=>{const div=document.createElement("div");div.style.cssText="padding:8px;border-bottom:1px solid #ddd";div.innerHTML=`<b>${h.time||""}</b><br>${h.text||""}<br><small>¥${Number(h.total||0).toLocaleString()}</small>`;if(deleteMode){const btn=document.createElement("button");btn.textContent="この会計を削除";btn.style.cssText="background:#d60000;margin-top:6px";btn.onclick=()=>window.deleteHistory(h.id);div.append("\n",btn)}historyDiv.appendChild(div)})}
function draw(){let sales=0,sold=0;itemsDiv.innerHTML="";products.forEach((p,i)=>{const soldQty=p.initial-p.stock;sales+=soldQty*p.price;sold+=soldQty;itemsDiv.innerHTML+=`<div class="item"><div><b>${p.name}</b><br>¥${p.price}</div><div class="controls"><button class="pm" onclick="minus(${i})">−</button><input value="${p.stock}" style="width:60px" onchange="setStock(${i},this.value)"><button class="pm" onclick="plus(${i})">＋</button></div></div>`});document.getElementById("sales").textContent="¥"+sales.toLocaleString();document.getElementById("sold").textContent=sold+"個";renderHistory()}
function totalPrice(){return cart.reduce((sum,c)=>sum+c.price*c.qty,0)}
function renderCart(){cartView.innerHTML=cart.map((c,i)=>`<div class="cartrow"><span>${c.name} × ${c.qty}</span><span>¥${(c.qty*c.price).toLocaleString()} <button onclick="removeCartItem(${i})">削除</button></span></div>`).join("");document.getElementById("total").textContent="¥"+totalPrice().toLocaleString();calcChange()}
async function firstLoad(){try{const snap=await getDoc(inventoryRef);if(snap.exists()){const data=snap.data();if(Array.isArray(data.stocks))data.stocks.forEach((s,i)=>{if(products[i])products[i].stock=Number(s)||0});historyLog=Array.isArray(data.history)?data.history:[]}else await saveFirestore();draw();renderCart()}catch(error){console.error("Firestore load error:",error);syncStatus.textContent="⚠️ Firebase読み込みエラー";syncStatus.style.color="orange"}}
onSnapshot(inventoryRef,snap=>{if(!snap.exists())return;const data=snap.data();if(ignoreSnapshot)return;if(Array.isArray(data.stocks))data.stocks.forEach((s,i)=>{if(products[i])products[i].stock=Number(s)||0});historyLog=Array.isArray(data.history)?data.history:[];draw();renderCart();syncStatus.textContent="🟢 リアルタイム同期中";syncStatus.style.color="green"},error=>{console.error("Firestore listener error:",error);syncStatus.textContent="🔴 Firebase同期エラー";syncStatus.style.color="red"});
window.plus=async i=>{products[i].stock++;draw();await saveFirestore()};window.minus=async i=>{if(products[i].stock<=0)return;products[i].stock--;draw();await saveFirestore()};window.setStock=async(i,v)=>{products[i].stock=Math.max(0,Number(v)||0);draw();await saveFirestore()};
window.addCart=()=>{const i=Number(productSelect.value),qty=Math.max(1,Number(document.getElementById("qty").value)||1),p=products[i];if(qty>p.stock)return alert(`${p.name} の在庫は ${p.stock} 個しかありません。`);cart.push({i,name:p.name,price:p.price,qty});renderCart()};window.addPaid=v=>{const e=document.getElementById("paid");e.value=(Number(e.value)||0)+v;calcChange()};window.setTotalToPaid=()=>{document.getElementById("paid").value=totalPrice();calcChange()};window.calcChange=()=>{const change=(Number(document.getElementById("paid").value)||0)-totalPrice();document.getElementById("change").textContent="¥"+change.toLocaleString()};window.removeCartItem=i=>{cart.splice(i,1);renderCart()};
window.checkout=async()=>{if(!cart.length)return alert("商品がありません");const total=totalPrice(),paid=Number(document.getElementById("paid").value)||0;if(paid<total)return alert("お預かり金額が不足しています");lastSale=structuredClone(cart);cart.forEach(c=>products[c.i].stock=Math.max(0,products[c.i].stock-c.qty));historyLog.unshift({id:Date.now(),time:new Date().toLocaleString("ja-JP"),text:cart.map(c=>`${c.name} × ${c.qty}`).join(" / "),total,items:structuredClone(cart)});cart=[];document.getElementById("paid").value="";draw();renderCart();await saveFirestore()};
window.undoLastCheckout=async()=>{if(!lastSale)return alert("取り消せる会計がありません");lastSale.forEach(c=>products[c.i].stock+=c.qty);historyLog.unshift({id:Date.now(),time:new Date().toLocaleString("ja-JP"),text:"会計取消",total:0,items:[]});lastSale=null;draw();await saveFirestore()};
window.toggleDeleteMode=()=>{deleteMode=!deleteMode;renderHistory()};window.deleteHistory=async id=>{const i=historyLog.findIndex(h=>h.id===id);if(i<0)return alert("会計履歴が見つかりません");const sale=historyLog[i];if(!sale.items?.length)return alert("この履歴には販売商品の情報がありません。\n在庫を自動で戻せません。");if(!confirm(`この会計履歴を削除しますか？\n\n${sale.text}\n\n削除すると、販売した商品の在庫も元に戻ります。`))return;sale.items.forEach(c=>{if(products[c.i])products[c.i].stock+=c.qty});historyLog.splice(i,1);draw();renderCart();await saveFirestore();alert("会計履歴を削除し、在庫も元に戻しました。")};
fillProducts();await firstLoad();console.log("Firebase Ready");
</script>
</body>
</html>
